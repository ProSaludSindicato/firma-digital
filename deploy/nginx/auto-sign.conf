# Plantilla nginx — copiar a /etc/nginx/sites-available/auto-sign
# Reemplazar: auto-sign.tudominio.com y (opcional) IP_DE_LARAVEL

server {
    listen 80;
    server_name auto-sign.sindicatoprosalud.com;

    # Tamaño máximo de subida (PDF + imagen). Debe ser >= 20 MB del servicio.
    client_max_body_size 25M;

    location / {
        # Descomentar para restringir acceso solo al servidor Laravel:
        # allow IP_DE_LARAVEL;
        # deny all;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
